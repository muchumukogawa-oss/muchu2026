<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きもちのいろ - choice1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background-color: #f9f9f9;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* 戻る矢印（explanation.html へ） */
      .back-arrow {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 14px 22px 14px 0;
        border-color: transparent #555 transparent transparent;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.1s ease;
      }
      .back-arrow:active {
        transform: scale(0.9);
      }

      /* タイトル */
      .title {
        font-size: clamp(18px, 3vw, 28px);
        font-weight: 900;
        color: #4a2828;
        margin-bottom: 25px;
      }
      .highlight-orange {
        color: #d9531e;
      }
      .highlight-red {
        color: #d93838;
      }

      /* 4色パネルグリッド */
      .color-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        width: clamp(280px, 45vw, 480px);
        height: clamp(180px, 30vw, 300px);
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .color-block {
        display: block;
        text-decoration: none;
        transition:
          opacity 0.2s ease,
          transform 0.1s ease;
      }
      .color-block:hover {
        opacity: 0.9;
      }
      .color-block:active {
        transform: scale(0.98);
      }

      /* 4色の領域カラー */
      .bg-red {
        background-color: #f5baba;
      }
      .bg-yellow {
        background-color: #fff2c4;
      }
      .bg-blue {
        background-color: #c9ddf8;
      }
      .bg-green {
        background-color: #d4ebd0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 戻るボタン（start.htmlへ） -->
      <a href="start.html" class="back-arrow" aria-label="もどる"></a>

      <h1 class="title">
        きみがかんじる<span class="highlight-orange">き</span><span class="highlight-red">もち</span>の<span
          class="highlight-red"
          >い</span
        ><span class="highlight-orange">ろ</span>はどれかな？
      </h1>

      <div class="color-grid">
        <!-- 赤エリア -->
        <a href="choice2_red.html" class="color-block bg-red" aria-label="赤系の色を選ぶ"></a>
        <!-- 黄エリア -->
        <a href="choice2_yellow.html" class="color-block bg-yellow" aria-label="黄系の色を選ぶ"></a>
        <!-- 青エリア -->
        <a href="choice2_blue.html" class="color-block bg-blue" aria-label="青系の色を選ぶ"></a>
        <!-- 緑エリア -->
        <a href="choice2_green.html" class="color-block bg-green" aria-label="緑系の色を選ぶ"></a>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きもちのいろ - choice1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
      }

      body {
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .back-arrow {
        position: absolute;
        left: 70.21px;
        top: 17.57px;
        width: 53px;
        height: 47px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      .back-arrow svg {
        width: 53px;
        height: 47px;
        display: block;
      }

      .title {
        position: absolute;
        left: 53%;
        top: 24px;
        width: 590px;
        height: 43px;
        transform: translateX(-50%);
        color: #4a2e2e;
        font-size: 30px;
        font-weight: 400;
        line-height: 43px;
        letter-spacing: 0.02em;
        text-align: center;
        margin: 0;
      }

      .highlight-red {
        color: #d95d5d;
        font-weight: 900;
      }

      .color-grid {
        position: absolute;
        left: 217px;
        top: 101px;
        width: 477px;
        height: 249.69px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        overflow: hidden;
      }

      .color-block {
        display: block;
        width: 100%;
        height: 100%;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      /* クリックしたボタンだけ少し小さくする */
      .back-arrow.clicked,
      .color-block.clicked {
        transform: scale(0.93);
      }

      .pink {
        background: #f0c7cb;
      }

      .yellow {
        background: #f0e4b4;
      }

      .blue {
        background: #b7d0eb;
      }

      .green {
        background: #cfe5c6;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <a href="start.html" class="back-arrow" aria-label="戻る">
        <svg viewBox="0 0 53 47" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M35 4 Q39 4 39 8 L39 39 Q39 43 35 41 L10 26 Q5 23.5 10 20 Z"
            fill="#ffffff"
            stroke="#403a3a"
            stroke-width="3"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
      </a>

      <h1 class="title">
        きみがかんじる<span class="highlight-red">きもち</span>の<span class="highlight-red">いろ</span>はどれかな？
      </h1>

      <div class="color-grid" aria-label="気持ちの色を選ぶ">
        <a href="choice2_red.html" class="color-block pink" aria-label="ピンク"></a>
        <a href="choice2_yellow.html" class="color-block yellow" aria-label="黄色"></a>
        <a href="choice2_blue.html" class="color-block blue" aria-label="青"></a>
        <a href="choice2_green.html" class="color-block green" aria-label="緑"></a>
      </div>
    </div>

    <script>
      const buttons = document.querySelectorAll(".back-arrow, .color-block");

      buttons.forEach((button) => {
        button.addEventListener("click", (event) => {
          // リンク先へ移動する前にアニメーションを表示する
          event.preventDefault();

          button.classList.add("clicked");

          setTimeout(() => {
            window.location.href = button.href;
          }, 120);
        });
      });
    </script>
  </body>
</html>

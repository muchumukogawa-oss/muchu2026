<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きもちのいろ - choice1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
      }

      body {
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .back-arrow {
        position: absolute;
        top: 20px;
        left: 24px;
        width: 0;
        height: 0;
        border-top: 18px solid transparent;
        border-bottom: 18px solid transparent;
        border-right: 26px solid #6a6460;
        text-decoration: none;
      }

      .title {
        color: #4a2e2e;
        font-size: clamp(20px, 3vw, 36px);
        font-weight: 900;
        line-height: 1.5;
        letter-spacing: 0.02em;
        text-align: center;
      }

      .highlight-orange {
        color: #e7a64a;
      }

      .highlight-red {
        color: #d95d5d;
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        grid-template-rows: repeat(2, minmax(120px, 1fr));
        width: min(58vw, 580px);
        height: min(38vw, 360px);
        max-width: 560px;
        max-height: 320px;
        overflow: hidden;
        border-radius: 0;
        box-shadow: none;
      }

      .color-block {
        display: block;
        width: 100%;
        height: 100%;
        text-decoration: none;
      }

      .pink {
        background: #f0c7cb;
      }

      .yellow {
        background: #f0e4b4;
      }

      .blue {
        background: #b7d0eb;
      }

      .green {
        background: #cfe5c6;
      }

      @media (max-width: 600px) {
        .page {
          gap: 18px;
        }

        .title {
          font-size: clamp(18px, 5vw, 28px);
        }

        .color-grid {
          width: min(76vw, 440px);
          height: min(54vw, 280px);
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <a href="start.html" class="back-arrow" aria-label="戻る"></a>

      <h1 class="title">
        きみがかんじる<span class="highlight-red">きもち</span>の<span class="highlight-red">いろ</span>はどれかな？
      </h1>

      <div class="color-grid" aria-label="気持ちの色を選ぶ">
        <a href="choice2_red.html" class="color-block pink" aria-label="ピンク"></a>
        <a href="choice2_yellow.html" class="color-block yellow" aria-label="黄色"></a>
        <a href="choice2_blue.html" class="color-block blue" aria-label="青"></a>
        <a href="choice2_green.html" class="color-block green" aria-label="緑"></a>
      </div>
    </div>
  </body>
</html>

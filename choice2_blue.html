<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>いちばんぴったりないろ - 青グループ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .back-arrow {
        position: absolute;
        left: 70.21px;
        top: 17.57px;
        width: 53px;
        height: 47px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        z-index: 100;
        pointer-events: auto;
      }

      .back-arrow svg {
        width: 53px;
        height: 47px;
        display: block;
        pointer-events: none;
      }

      .back-arrow:active {
        transform: translateY(2px) scale(0.96);
        filter: brightness(0.98);
      }

      .content-wrap {
        position: absolute;
        left: 91px;
        top: 0;
        width: 100%;
        height: 100%;
      }

      .title-area {
        position: absolute;
        left: 91px;
        top: 149px;
        width: 300px;
        height: 86px;
        color: #3e0000;
        font-size: 30px;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 0.02em;
        text-align: center;
      }

      .title-area p {
        margin: 0;
      }

      .title-area .highlight-brown {
        color: #c75637;
        font-weight: 700;
      }

      .color-card {
        position: absolute;
        display: block;
        width: 115px;
        height: 115px;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease,
          box-shadow 0.08s ease;
      }

      /* 表情画像のベース配置 */
      .emotion-img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 70%;
        height: 70%;
        object-fit: contain;
        pointer-events: none;
        transform: translate(-50%, -52%);
      }

      /* ショック（.color2）：右に少し移動 */
      .color2 .emotion-img {
        transform: translate(-40%, -52%);
      }

      /* 不安・心配：右、上に移動 */
      .color-anxiety .emotion-img,
      .color-card[aria-label*="不安"] .emotion-img,
      .color-card[aria-label*="心配"] .emotion-img {
        transform: translate(-30%, -62%);
      }

      /* 悲しい（.color6）：少し下に移動 */
      .color6 .emotion-img {
        width: 85%;
        height: 85%;
        transform: translate(-50%, -46%);
      }

      /* 疲れた（.color8）：少し上、少し右に移動 */
      .color8 .emotion-img {
        transform: translate(-48%, -58%);
      }

      .color-card.short .emotion-img {
        width: 70%;
        height: 70%;
        transform: translate(-50%, -52%);
      }

      .color7 .emotion-img {
        width: 85%;
        height: 85%;
        transform: translate(-50%, -52%);
      }

      .color-card:active {
        transform: translateY(2px) scale(0.98);
        filter: brightness(0.97);
        box-shadow: inset 0 6px 10px rgb(0 0 0 / 12%);
      }

      .color-card.short {
        height: 56.5px;
      }

      .color1 {
        left: 426px;
        top: 20px;
        background: #800080;
      }
      .color2 {
        left: 546px;
        top: 20px;
        background: #333333;
      }
      .color3 {
        left: 666px;
        top: 20px;
        background: #c49a6a;
      }

      .color5 {
        left: 666px;
        top: 139px;
        background: #000080;
      }
      .color6 {
        left: 426px;
        top: 258px;
        background: #0000ff;
      }

      .color7 {
        left: 546px;
        top: 258px;
        background: #4a148c;
      }
      .color8 {
        left: 666px;
        top: 258px;
        background: #778899;
      }
      .color9 {
        left: 426px;
        top: 139px;
        background: #1e90ff;
      }

      .color10 {
        left: 546px;
        top: 139px;
        height: 56.5px;
        background: #90caf9;
      }

      .color11 {
        left: 546px;
        top: 197.5px;
        height: 56.5px;
        background: #4682b4;
      }

      @media (max-width: 900px) {
        .content-wrap {
          left: 0;
        }

        .title-area {
          left: 75px;
          top: 149px;
          width: 350px;
          font-size: 30px;
        }

        .color1 {
          left: 426px;
          top: 20px;
        }
        .color2 {
          left: 546px;
          top: 20px;
        }
        .color3 {
          left: 666px;
          top: 20px;
        }

        .color5 {
          left: 666px;
          top: 139px;
        }
        .color6 {
          left: 426px;
          top: 258px;
        }
        .color7 {
          left: 546px;
          top: 258px;
        }
        .color8 {
          left: 666px;
          top: 258px;
        }
        .color9 {
          left: 426px;
          top: 139px;
        }
        .color10 {
          left: 546px;
          top: 139px;
        }
        .color11 {
          left: 546px;
          top: 197.5px;
        }
      }
    </style>
    <link rel="stylesheet" href="mobile-layout.css" />
  </head>

  <body>
    <div class="page">
      <a href="./choice1.html" class="back-arrow" aria-label="戻る">
        <svg viewBox="0 0 53 47" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M35 4 Q39 4 39 8 L39 39 Q39 43 35 41 L10 26 Q5 23.5 10 20 Z"
            fill="#ffffff"
            stroke="#403a3a"
            stroke-width="3"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
      </a>

      <div class="content-wrap">
        <div class="title-area">
          <p>「いちばんぴったり」</p>
          <p>な<span class="highlight-brown">いろ</span>はどれかな？</p>
        </div>

        <a href="./decision.html?color=%23800080" class="color-card color1" aria-label="紫1：しつこい"
          ><img src="img/しつこい.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%23333333" class="color-card color2" aria-label="黒：ショック"
          ><img src="img/ショック.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%23c49a6a" class="color-card color3" aria-label="ベージュ：面白くない"
          ><img src="img/面白くない.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%23000080" class="color-card color5" aria-label="紺：がっかりする"
          ><img src="img/がっかり.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%230000ff" class="color-card color6" aria-label="青：悲しい"
          ><img src="img/悲しい.svg" alt="" class="emotion-img"
        /></a>

        <a href="./decision.html?color=%234a148c" class="color-card color7" aria-label="紫2：悔しい"
          ><img src="img/悔しい.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%23778899" class="color-card color8" aria-label="グレー青：疲れた"
          ><img src="img/疲れた.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%231e90ff" class="color-card color9" aria-label="青：泣きたい"
          ><img src="img/泣きたい.svg" alt="" class="emotion-img"
        /></a>

        <a href="./decision.html?color=%2390caf9" class="color-card color10 short" aria-label="薄青：かわいそう"
          ><img src="img/可愛想.svg" alt="" class="emotion-img"
        /></a>
        <a href="./decision.html?color=%234682b4" class="color-card color11 short" aria-label="青灰：寂しい"
          ><img src="img/寂しい.svg" alt="" class="emotion-img"
        /></a>
      </div>
    </div>
  </body>
</html>

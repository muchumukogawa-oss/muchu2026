<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>あそびかた - きもちのたんけん</title>
    <!-- Google Fontsから全丸ゴシックを読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
      }

      /* 画面全体（背景1：background_grass.png） */
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        background-image: url("img/background_grass.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 右上の大きなコンパス */
      .compass {
        position: absolute;
        top: -25px;
        right: -25px;
        width: clamp(140px, 22vw, 220px);
        height: auto;
        z-index: 8;
        pointer-events: none;
      }

      /* 中央の巻物エリア（map.png） */
      .scroll-container {
        position: relative;
        width: 82%;
        max-width: 860px;
        height: 82vh;
        max-height: 520px;
        z-index: 2; /* 草（z-index: 5）の下に潜り込ませる */

        background-image: url("img/map.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        /* 左の巻物軸部分を考慮した余白 */
        padding: 3% 6% 4% 18%;
      }

      /* タイトル「あそびかた」 */
      .content-title {
        font-size: clamp(22px, 3.6vw, 36px);
        font-weight: 900;
        color: #4a2828;
        text-align: center;
        margin-bottom: 16px;
        padding-bottom: 4px;
        border-bottom: 3px solid #b87b5c;
        display: inline-block;
        letter-spacing: 0.05em;
      }

      /* 本文テキスト */
      .content-text {
        font-size: clamp(15px, 2.1vw, 22px);
        font-weight: 900;
        color: #4a2828;
        text-align: center;
        line-height: 1.6;
        margin-bottom: 16px;
      }

      /* ハイライト文字色 */
      .highlight-red {
        color: #d93838;
      }

      /* 4色の顔を横並びにするコンテナ */
      .faces-row {
        display: flex;
        gap: clamp(8px, 1.8vw, 18px);
        justify-content: center;
        align-items: center;
      }

      /* 各色付き顔の共通スタイル */
      .face-circle {
        position: relative;
        width: clamp(50px, 8.5vw, 85px);
        height: clamp(50px, 8.5vw, 85px);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 4つの背景色 */
      .face-red {
        background-color: #eb4343;
      }
      .face-blue {
        background-color: #0075c9;
      }
      .face-yellow {
        background-color: #f2ba13;
      }
      .face-green {
        background-color: #009e52;
      }

      /* 表情画像（expression_example.png） */
      .expression-img {
        width: 80%;
        height: 80%;
        object-fit: contain;
      }

      /* 前景の草（grass.png：巻物やコンパスの上に重なる） */
      .grass-foreground {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("img/grass.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        pointer-events: none;
        z-index: 5;
      }

      /* 左側の矢印（まえへ） */
      .prev-btn {
        position: absolute;
        left: 3vw;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 16px 26px 16px 0;
        border-color: transparent #ffffff transparent transparent;
        filter: drop-shadow(0px 0px 2px #333) drop-shadow(-2px 2px 3px rgba(0, 0, 0, 0.3));
        cursor: pointer;
        z-index: 10;
        text-decoration: none;
        transition: transform 0.1s ease;
      }

      .prev-btn:active {
        transform: translateY(-50%) scale(0.9);
      }

      /* 右側の矢印（つぎへ / ゲーム開始などへ） */
      .next-btn {
        position: absolute;
        right: 3vw;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 16px 0 16px 26px;
        border-color: transparent transparent transparent #ffffff;
        filter: drop-shadow(0px 0px 2px #333) drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.3));
        cursor: pointer;
        z-index: 10;
        text-decoration: none;
        transition: transform 0.1s ease;
      }

      .next-btn:active {
        transform: translateY(-50%) scale(0.9);
      }

      /* 下部のページ表示（枠線なしの丸） */
      .dots-container {
        position: absolute;
        bottom: 3.5vh;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
      }

      .dot {
        width: 12px;
        height: 12px;
        background-color: rgba(255, 255, 255, 0.65);
        border: none;
        border-radius: 50%;
      }

      .dot.active {
        background-color: #ffffff;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- 右上の大きなコンパス -->
      <img src="img/compass.png" alt="コンパス" class="compass" />

      <!-- 中央の巻物コンテンツ -->
      <div class="scroll-container">
        <h1 class="content-title">あそびかた</h1>

        <div class="content-text">
          <p>きみの えらんだ <span class="highlight-red">いろ</span>は どれかな？</p>
        </div>

        <!-- 4色の顔パーツ並び -->
        <div class="faces-row">
          <div class="face-circle face-red">
            <img src="img/expression_example.png" alt="赤の表情" class="expression-img" />
          </div>
          <div class="face-circle face-blue">
            <img src="img/expression_example.png" alt="青の表情" class="expression-img" />
          </div>
          <div class="face-circle face-yellow">
            <img src="img/expression_example.png" alt="黄の表情" class="expression-img" />
          </div>
          <div class="face-circle face-green">
            <img src="img/expression_example.png" alt="緑の表情" class="expression-img" />
          </div>
        </div>
      </div>

      <!-- 前景の草（巻物の手前に被せる） -->
      <div class="grass-foreground"></div>

      <!-- 左矢印（rules1へ戻る） -->
      <a href="rules1.html" class="prev-btn" aria-label="まえへ"></a>

      <!-- 右矢印（explanationへ進む） -->
      <a href="start.html" class="next-btn" aria-label="つぎへ"></a>

      <!-- 下部のページ丸（6番目がアクティブ） -->
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きもちのたんけん</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .background {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        padding: 2vh 12px;

        background-image: url("img/background_top.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .title-logo {
        width: min(65vw, 560px);
        height: 50vh;
        object-fit: contain;
        transform: translate(-24px, -6px);
        filter: drop-shadow(0 4px 8px rgb(0 0 0 / 15%));
      }

      .sub-text {
        color: #572d2d;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: clamp(18px, 3.5vw, 28px);
        font-weight: 500;
        line-height: 1.35;
        text-align: center;
        -webkit-text-stroke: 3px #fff;
        paint-order: stroke fill;
        text-shadow: 0 5px 8px rgb(0 0 0 / 35%);
        transform: translate(30px, -10px);
      }

      .highlight-red {
        color: #dd5f5f;
        font-weight: 700;
      }

      .start-btn {
        display: flex;
        width: 200px;
        height: 70px;
        align-items: center;
        justify-content: center;

        background: url("img/button_red.png") center / contain no-repeat;
        color: #fff;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-decoration: none;
        transform: translate(20px, -10px);
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .start-btn:active {
        transform: translate(20px, -10px) scale(0.95);
      }

      @media (max-width: 600px) {
        .title-logo {
          width: min(88vw, 560px);
          height: 50vh;
          transform: translate(-4px, -4px);
        }

        .sub-text {
          font-size: clamp(17px, 5vw, 28px);
        }

        .start-btn {
          width: 180px;
          height: 64px;
          font-size: 21px;
        }
      }
    </style>
  </head>

  <body>
    <main class="background">
      <img src="img/titlelog.png" alt="きもちのたんけん" class="title-logo" />

      <p class="sub-text">
        <span class="highlight-red">いろ</span>をタップして、<br />
        <span class="highlight-red">きもち</span>のことばをさがしにいこう！
      </p>

      <a href="tos.html" class="start-btn">はじめる</a>
    </main>
  </body>
</html>

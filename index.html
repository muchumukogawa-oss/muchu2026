<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>きもちのたんけん</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .background {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between; /* 上下にゆったり分散配置 */
        padding: 40px 16px 30px; /* 上下の余白をしっかり確保 */

        background-image: url("img/background_top.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ロゴ：画面幅の92%を使って大きく表示 */
      .title-logo {
        width: 92vw;
        max-width: 600px;
        height: auto; /* 高さは自動計算にして潰れないようにする */
        max-height: 52dvh;
        object-fit: contain;
        filter: drop-shadow(0 4px 8px rgb(0 0 0 / 15%));
      }

      /* 本文：文字サイズをくっきり大きく固定 */
      .sub-text {
        color: #572d2d;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: 24px; /* 小さくならないよう固定値 */
        font-weight: 700;
        line-height: 1.4;
        text-align: center;
        -webkit-text-stroke: 6px #fff;
        paint-order: stroke fill;
        text-shadow: 0 5px 8px rgb(0 0 0 / 35%);
      }

      .highlight-red {
        color: #dd5f5f;
        font-weight: 900;
      }

      /* はじめるボタン：しっかり大きく配置 */
      .start-btn {
        display: flex;
        width: 220px;
        height: 74px;
        align-items: center;
        justify-content: center;

        background: url("img/button_red.png") center / contain no-repeat;
        color: #fff;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .start-btn:active {
        transform: scale(0.95);
      }

      .start-btn-label {
        transform: translate(2px, -2px);
      }

      /* 画面の縦幅がとても小さいスマホ向けの調整 */
      @media (max-height: 600px) {
        .background {
          padding: 20px 12px 15px;
        }
        .title-logo {
          max-height: 45dvh;
        }
        .sub-text {
          font-size: 20px;
          -webkit-text-stroke: 5px #fff;
        }
        .start-btn {
          width: 180px;
          height: 60px;
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>
    <main class="background">
      <img src="img/titlelog.png" alt="きもちのたんけん" class="title-logo" />

      <p class="sub-text">
        <span class="highlight-red">いろ</span>をタップして、<br />
        <span class="highlight-red">きもち</span>のことばをさがしにいこう！
      </p>

      <a href="tos.html" class="start-btn"><span class="start-btn-label">はじめる</span></a>
    </main>
  </body>
</html>

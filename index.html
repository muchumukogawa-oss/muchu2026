<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>きもちのたんけん</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .background {
        display: flex;
        width: 100%;
        height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        padding: 2vh 12px;

        background-image: url("img/background_top.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .title-logo {
        width: min(65vw, 560px);
        height: 45vh;
        object-fit: contain;
        transform: translate(0, 0);
        filter: drop-shadow(0 4px 8px rgb(0 0 0 / 15%));
      }

      .sub-text {
        color: #572d2d;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: clamp(16px, 3.5vw, 26px);
        font-weight: 500;
        line-height: 1.35;
        text-align: center;
        -webkit-text-stroke: 5px #fff;
        paint-order: stroke fill;
        text-shadow: 0 5px 8px rgb(0 0 0 / 35%);
      }

      .highlight-red {
        color: #dd5f5f;
        font-weight: 700;
      }

      .start-btn {
        display: flex;
        width: 200px;
        height: 65px;
        align-items: center;
        justify-content: center;

        background: url("img/button_red.png") center / contain no-repeat;
        color: #fff;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .start-btn:active {
        transform: scale(0.95);
      }

      .start-btn-label {
        transform: translate(0, 0);
      }

      /* スマホを横向き（高さが低い画面）にした時の調整 */
      @media (orientation: landscape) and (max-height: 500px) {
        .background {
          padding: 1vh 12px;
          justify-content: space-around;
        }

        .title-logo {
          height: 38vh;
        }

        .sub-text {
          font-size: clamp(13px, 3.2vh, 20px);
          -webkit-text-stroke: 4px #fff;
        }

        .start-btn {
          width: 150px;
          height: 48px;
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <main class="background">
      <img src="img/titlelog.png" alt="きもちのたんけん" class="title-logo" />

      <p class="sub-text">
        <span class="highlight-red">いろ</span>をタップして、<br />
        <span class="highlight-red">きもち</span>のことばをさがしにいこう！
      </p>

      <a href="tos.html" class="start-btn"><span class="start-btn-label">はじめる</span></a>
    </main>
  </body>
</html>

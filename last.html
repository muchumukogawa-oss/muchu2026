<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>こたえをみてみよう！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 1. 全体ベース設定（Android/iPadのスクロール・余白・白枠を徹底防ぐ） */
      html,
      body {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important; /* Android Chrome / iOS Safari の動的アドレスバー対応 */
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        font-family: "Zen Maru Gothic", sans-serif;
        touch-action: none; /* スマホ・タブレットでの不要な引っ張りスクロール防止 */
      }

      /* 2. 背景（.stage）：画面いっぱいに背景画像をカバー */
      .stage {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;

        background-image: url("img/newback6.png") !important;
        background-position: center center !important;
        background-size: cover !important;
        background-repeat: no-repeat !important;

        /* iPhone / iPad / Android のセーフエリア（カメラパンチホール・ホームバー）を保護 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left) !important;
      }

      /* 3. コンテンツ枠（.stage-inner）：アスペクト比 836:394 を維持し、画面内に100%収める */
      .stage-inner {
        position: relative !important;

        /* 
    iPadのような四角い画面（4:3）でも、Androidのような極端な横長画面（20:9）でも
    上下左右に絶対に切れず、画面にピッタリ納める計算式（画面幅の95%に安全マージンを設定）
  */
        width: min(95vw, calc(95dvh * (836 / 394))) !important;
        height: min(95dvh, calc(95vw * (394 / 836))) !important;
        aspect-ratio: 836 / 394 !important;

        container-type: inline-size;
        margin: auto !important;
      }

      /* 中央の巻物エリア */
      .scroll-container {
        position: absolute;
        top: 0.51%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        width: 95.7%;
        height: 100%;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 8% 5% 4% 22%;
      }

      /* 中央コンテンツエリア */
      .content {
        position: absolute;
        left: 58.5%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 72%;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      /* タイトルテキスト（vwから%・cqiへ変更） */
      .title {
        margin-bottom: 4.67%; /* 2.2vw 相当 */
        color: #3e0000;
        font-size: 3.5cqi; /* 3.5vw 相当（親枠の3.5%基準） */
        line-height: 1.35;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 500;
        white-space: nowrap;
      }

      .title .red {
        color: #c75637;
        font-weight: 700;
      }

      .title .brown {
        color: #3e0000;
        font-weight: 500;
      }

      /* 「はじめから」ボタン（理想の横幅と内側余白に調整） */
      .start-btn {
        /* ★ ボタン全体の横幅を文字がゆったり収まるサイズ（約192px相当）に設定 */
        width: 23cqw !important;
        height: auto !important;
        aspect-ratio: 192 / 46 !important; /* 目標画像の縦横比 */

        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;

        /* 文字の折り返しと左右余白の確保 */
        white-space: nowrap !important;
        padding: 0 1.5cqi !important;

        /* f576fa.png にあわせた外枠・黄色枠・背景色 */
        border-radius: 999px !important;
        border: 0.38cqi solid #5c3c21 !important; /* 濃茶の外枠 */
        background: #fff3e0 !important; /* クリーム色の内側背景 */
        box-shadow: inset 0 0 0 0.32cqi #f2aa2c !important; /* 内側の黄色の帯 */

        /* タイポグラフィ（Zen Maru Gothic Medium / 24px 相当） */
        color: #3e0000 !important;
        font-family: "Zen Maru Gothic", sans-serif !important;
        font-size: 2.5cqi !important; /* 文字のバランス */
        font-weight: 500 !important; /* Medium */
        letter-spacing: 0.02em !important;
        line-height: 1 !important;
        text-align: center !important;
        text-decoration: none !important;

        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .start-btn:active {
        transform: translateY(0.2%);
        filter: brightness(0.98);
      }
      .grass-foreground {
        position: absolute;
        inset: 0;
        background: url("img/grass.png") center / 100% 100% no-repeat;
        pointer-events: none;
        z-index: 4;
      }
    </style>
    <link rel="stylesheet" href="mobile-layout.css" />
  </head>

  <body>
    <main class="stage">
      <!-- ★ stage-inner で中のコンテンツ全体を包む -->
      <div class="stage-inner">
        <div class="map-panel" aria-hidden="true"></div>
        <div class="content">
          <h1 class="title">
            ほかにもぴったりな<span class="red">いろ</span>があるかも！<br />
            こたえをみてみよう！
          </h1>
          <a href="choice1.html" class="start-btn">はじめから</a>
        </div>
        <!--<div class="grass-foreground" aria-hidden="true"></div>-->
      </div>
    </main>
  </body>
</html>

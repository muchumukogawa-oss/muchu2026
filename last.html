<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>こたえをみてみよう！ - きもちのたんけん</title>
    <!-- Google Fontsから全丸ゴシックを読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
      }

      /* 画面全体（背景1：background_grass.png） */
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        background-image: url("img/background_grass.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 中央の巻物エリア（map.png） */
      .scroll-container {
        position: relative;
        width: 82%;
        max-width: 860px;
        height: 82vh;
        max-height: 520px;
        z-index: 2; /* 草（z-index: 5）の下に潜り込ませる */

        background-image: url("img/map.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        /* 左の巻物軸部分を考慮した余白 */
        padding: 4% 6% 5% 18%;
      }

      /* 本文テキスト */
      .content-text {
        font-size: clamp(16px, 2.3vw, 24px);
        font-weight: 900;
        color: #4a2828;
        text-align: center;
        line-height: 1.8;
        margin-bottom: 24px;
      }

      .content-text p {
        margin-bottom: 6px;
      }

      /* ハイライト文字色 */
      .highlight-red {
        color: #d93838;
      }

      .highlight-brown {
        color: #b85232;
      }

      /* 「はじめから」ボタン（CSSデザイン） */
      .restart-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: clamp(140px, 22vw, 200px);
        height: clamp(42px, 6.5vw, 56px);
        background-color: #fff3db;
        border: 4px solid #8c4a11;
        border-radius: 30px;
        color: #4a2828;
        font-size: clamp(16px, 2.2vw, 22px);
        font-weight: 900;
        text-decoration: none;
        letter-spacing: 0.05em;
        cursor: pointer;
        box-shadow: 0 4px 0 #5c300a;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .restart-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #5c300a;
      }

      /* 前景の草（grass.png：巻物の手前に被せる） */
      .grass-foreground {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("img/grass.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- 中央の巻物コンテンツ -->
      <div class="scroll-container">
        <div class="content-text">
          <p>ほかにもぴったりな<span class="highlight-red">いろ</span>があるかも！</p>
          <p>こたえをみてみよう！</p>
        </div>

        <!-- はじめからボタン（choice1.html へ遷移） -->
        <a href="choice1.html" class="restart-btn">はじめから</a>
      </div>

      <!-- 前景の草（巻物の手前に被せる） -->
      <div class="grass-foreground"></div>
    </div>
  </body>
</html>

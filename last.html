<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>こたえをみてみよう！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;

        margin: 0;

        padding: 0;
      }

      html,
      body {
        width: 100%;

        height: 100%;

        overflow: hidden;

        font-family: "Zen Maru Gothic", sans-serif;

        background: #f3f3f3;
      }

      .stage {
        position: relative;

        width: 100%;

        height: 100vh;

        background: url("img/background_grass.png") center / cover no-repeat;
      }

      /* マップパネル（800.03px / 836px ≒ 95.7%、394px / 394px = 100%） */

      .map-panel {
        position: absolute;

        left: 2.15%; /* 18px / 836px */

        top: 0.51%; /* 2px / 394px */

        width: 95.7%; /* 800.03px / 836px */

        height: 100%; /* 394px / 394px */

        background: url("img/map.png") center / 100% 100% no-repeat;

        z-index: 2;
      }

      /* 中央コンテンツエリア（巻き軸を考慮して紙面中央 58.5% 付近に配置） */

      .content {
        position: absolute;

        left: 58.5%;

        top: 50%;

        transform: translate(-50%, -50%);

        width: 72%; /* 文字がゆったり入る幅 */

        height: auto;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        z-index: 3;
      }

      /* タイトルテキスト */

      .title {
        margin-bottom: 2.2vw; /* 要素間の余白 */

        color: #3e0000;

        font-size: 3.5vw; /* 30px 相当をレスポンシブ化 */

        line-height: 1.35;

        letter-spacing: 0.04em;

        text-align: center;

        font-weight: 500;

        white-space: nowrap; /* 勝手な途中改行を防止 */
      }

      .title .red {
        color: #c75637;

        font-weight: 700;
      }

      .title .brown {
        color: #3e0000;

        font-weight: 500;
      }

      /* スタートボタン（192px x 47.2px 相当） */

      .start-btn {
        width: 23vw; /* 192px / 836px 相当 */

        height: 5.6vw; /* ボタンの縦横比を固定するため vw で統一 */

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 999px;

        border: 0.46vw solid #624529;

        background: #ffebd3;

        box-shadow: inset 0 0 0 0.46vw #f5b134;

        color: #3e0000;

        text-decoration: none;

        font-size: 2.8vw; /* 24px 相当 */

        font-weight: 700;

        line-height: 1;

        text-align: center;

        cursor: pointer;

        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .start-btn:active {
        transform: translateY(0.2vw);

        filter: brightness(0.98);
      }

      .grass-foreground {
        position: absolute;

        inset: 0;

        background: url("img/grass.png") center / 100% 100% no-repeat;

        pointer-events: none;

        z-index: 4;
      }
    </style>
    <link rel="stylesheet" href="mobile-layout.css" />
  </head>

  <body>
    <main class="stage">
      <div class="map-panel" aria-hidden="true"></div>

      <div class="content">
        <h1 class="title">
          ほかにもぴったりな<span class="red">いろ</span>があるかも！<br />
          こたえをみてみよう！
        </h1>

        <a href="choice1.html" class="start-btn">はじめから</a>
      </div>

      <div class="grass-foreground" aria-hidden="true"></div>
    </main>
  </body>
</html>

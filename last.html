<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>こたえをみてみよう！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        background: url("img/background_grass.png") center / 100% 100% no-repeat;
      }

      .map-panel {
        position: absolute;
        left: 18px;
        top: 2px;
        width: 800.03px;
        height: 394px;
        background: url("img/map.png") center / 100% 100% no-repeat;
        z-index: 2;
      }

      .content {
        position: absolute;
        left: 58%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 390px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      .title {
        margin-bottom: 24px;
        color: #4a2e2e;
        font-size: 30px;
        line-height: 1.6;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 400;
      }

      .title .red {
        color: #d95d5d;
      }

      .title .brown {
        color: #a95d46;
        font-weight: 900;
      }

      .start-btn {
        width: 192px;
        height: 47.2px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 4px solid #624529;
        background: #ffebd3;
        box-shadow: inset 0 0 0 4px #f5b134;
        color: #4a2e2e;
        text-decoration: none;
        font-size: 24px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .start-btn:active {
        transform: translateY(2px);
        filter: brightness(0.98);
      }

      .grass-foreground {
        position: absolute;
        inset: 0;
        background: url("img/grass.png") center / 100% 100% no-repeat;
        pointer-events: none;
        z-index: 4;
      }

      @media (max-width: 900px) {
        .map-panel {
          left: 18px;
          top: 2px;
          width: 800.03px;
          height: 394px;
        }

        .content {
          width: 63vw;
          height: 42vw;
        }

        .title {
          font-size: 30px;
        }

        .start-btn {
          width: 192px;
          height: 47.2px;
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <main class="stage">
      <div class="map-panel" aria-hidden="true"></div>

      <div class="content">
        <h1 class="title">
          ほかにもぴったりな<span class="red">いろ</span>があるかも！<br />
          こたえをみてみよう！
        </h1>

        <a href="choice1.html" class="start-btn">はじめから</a>
      </div>

      <div class="grass-foreground" aria-hidden="true"></div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>このいろできまり？</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* タイトルエリア */
      .title {
        position: absolute;
        left: 50%;
        top: 6.09%; /* 24px / 394px */
        transform: translateX(-50%);
        width: 57.4%; /* 500px / 871px */
        color: #3e0000;
        font-size: 3.4vw;
        line-height: 1.2;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 500;
      }

      .title .red {
        color: #c75637;
        font-weight: 700;
      }

      .title .brown {
        color: #3e0000;
        font-weight: 500;
      }

      /* 中央のグレーの枠 */
      .color-box {
        position: absolute;
        left: 37.77%; /* 329px / 871px */
        top: 23.86%; /* 94px / 394px */
        width: 24.45%; /* 213px / 871px */
        height: 49.49%; /* 195px / 394px */
        background: #d9d9d9;
        border: 0.1vw solid rgba(0, 0, 0, 0.08);
      }

      /* 表情画像の基本配置設定（.color-box 内にピッタリ収まるよう中央配置） */
      .expression {
        position: absolute;
        left: 39.67%; /* 345.5px / 871px */
        top: 27.66%; /* 109px / 394px */
        width: 20.67%; /* 180px / 871px */
        height: 41.88%; /* 165px / 394px */
        padding: 0;
        object-fit: contain;
        pointer-events: none;
        transition: transform 0.1s ease;
      }

      /* --- 微調整ルール (相対値化) --- */
      .expression[data-emotion="ショック"] {
        transform: translate(1.1vw, 0);
      }

      .expression[data-emotion="不安・心配"] {
        transform: translate(2.3vw, -1.7vw);
      }

      .expression[data-emotion="悲しい"] {
        padding: 0;
        transform: translate(0, 1.1vw);
      }

      .expression[data-emotion="疲れた"] {
        transform: translate(0.46vw, -1.7vw);
      }

      .expression[data-emotion="悔しい"] {
        padding: 0;
      }

      .expression[data-emotion="穏やか"],
      .expression[data-emotion] {
        transform: none;
      }

      .expression--white-outline {
        filter: brightness(0) invert(1) drop-shadow(0.11vw 0 0 #fff)
          drop-shadow(-0.11vw 0 0 #fff) drop-shadow(0 0.11vw 0 #fff)
          drop-shadow(0 -0.11vw 0 #fff);
      }

      /* ボタンの共通スタイル */
      .btn {
        position: absolute;
        width: 20.67%; /* 180px / 871px */
        height: 12.69%; /* 50px / 394px */
        border: 0.46vw solid #624529;
        background: #ffebd3;
        box-shadow: inset 0 0 0 0.46vw #f5b134;
        border-radius: 999px;
        color: #3e0000;
        font-size: 2.75vw;
        font-family: inherit;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .btn:active {
        transform: translateY(0.5%);
        filter: brightness(0.98);
      }

      /* 「ちがう」ボタン */
      .no-btn {
        left: 25.26%; /* 220px / 871px */
        top: 80.2%; /* 316px / 394px */
      }

      /* 「ぴったり」ボタン */
      .yes-btn {
        left: 56.14%; /* 489px / 871px */
        top: 80.2%; /* 316px / 394px */
      }
    </style>
    <link rel="stylesheet" href="mobile-layout.css" />
  </head>

  <body>
    <div class="page">
      <h1 class="title">この<span class="red">いろ</span>できまり？</h1>

      <div
        id="selectedColorBox"
        class="color-box"
        aria-label="選択した色"
      ></div>
      <img
        id="selectedExpression"
        class="expression"
        alt="選んだ色に合う表情"
        hidden
      />

      <button class="btn no-btn" type="button" onclick="history.back()">
        いいえ
      </button>
      <a id="yesBtn" class="btn yes-btn" href="explanation.html">はい</a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const color = params.get("color");
      const example = params.get("example");
      const label = params.get("label");
      const expressions = {
        "#ff0000": "怒る",
        "#000000": "怖い",
        "#0068b7": "びびりびっくり",
        "#ff4e00": "うるさい",
        "#910055": "危ない",
        "#a9a9a9": "不安・心配",
        "#a757a8": "嫌",
        "#d8bfd8": "困る",
        "#db7093": "恥ずかしい",
        "#ff7043": "イライラ",
        "#800080": "しつこい",
        "#333333": "ショック",
        "#c49a6a": "面白くない",
        "#1e90ff": "泣きたい",
        "#90caf9": "可愛想",
        "#4682b4": "寂しい",
        "#000080": "がっかり",
        "#0000ff": "悲しい",
        "#4a148c": "悔しい",
        "#778899": "疲れた",
        "#ffcc00": "嬉しくてびっくり(1)",
        "#ff8c00": "面白い",
        "#ff5a5a": "やる気がある",
        "#ffeb3b": "嬉しい",
        "#ff9f63": "興奮した",
        "#ffff00": "喜ぶ",
        "#ffa500": "楽しい",
        "#ffc0cb": "幸せ",
        "#e91e63": "愛",
        "#f48fb1": "好き",
        "#90ee90": "気楽・のんびり",
        "#ffd700": "素敵",
        "#a5d4ad": "リラックス",
        "#008000": "安心する",
        "#ffdab9": "感謝する",
        "#ccff99": "優しい",
        "#aed581": "穏やか",
        "#ffffff": "気にしない",
        "#00fa9a": "気持ちいい",
      };

      if (color) {
        document.getElementById("selectedColorBox").style.backgroundColor =
          color;
        const explanationParams = new URLSearchParams({ color });
        if (label) {
          explanationParams.set("label", label);
        }
        if (example) {
          explanationParams.set("example", example);
        }
        const normalizedColor = color.toLowerCase();
        const emotion =
          label === "かんどう"
            ? "嬉しくてびっくり"
            : expressions[normalizedColor];
        if (emotion) {
          const expression = document.getElementById("selectedExpression");
          expression.src = `img/${emotion}.svg`;
          expression.alt = `${label || emotion}の表情`;
          // JavaScriptで感情名をdata属性にセットしてCSSの位置微調整を発動させる
          expression.setAttribute("data-emotion", emotion);
          expression.classList.toggle(
            "expression--white-outline",
            normalizedColor === "#000000",
          );
          expression.hidden = false;
          explanationParams.set("emotion", emotion);
        }
        document.getElementById("yesBtn").href =
          "explanation.html?" + explanationParams.toString();
      }
    </script>
  </body>
</html>

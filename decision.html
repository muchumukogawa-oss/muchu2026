<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>このいろできまり？</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .title {
        position: absolute;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        width: 500px;
        color: #4a2e2e;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 400;
      }

      .title .red {
        color: #d95d5d;
      }

      .title .brown {
        color: #b05a3f;
        font-weight: 900;
      }

      .color-box {
        position: absolute;
        left: 329px;
        top: 94px;
        width: 213px;
        height: 195px;
        background: #d9d9d9;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .btn {
        position: absolute;
        width: 180px;
        height: 50px;
        border: 4px solid #624529;
        background: #ffebd3;
        box-shadow: inset 0 0 0 4px #f5b134;
        border-radius: 999px;
        color: #4a2e2e;
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .btn:active {
        transform: translateY(2px);
        filter: brightness(0.98);
      }

      .no-btn {
        left: 220px;
        top: 316px;
      }

      .yes-btn {
        left: 489px;
        top: 316px;
      }

      @media (max-width: 700px) {
        .title {
          width: 90%;
          font-size: 26px;
        }

        .color-box {
          top: 100px;
          width: 200px;
          height: 200px;
        }

        .no-btn {
          left: 40px;
          top: 340px;
        }

        .yes-btn {
          left: 240px;
          top: 340px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <h1 class="title">この<span class="red">いろ</span>できまり？</h1>

      <div id="selectedColorBox" class="color-box" aria-label="選択した色"></div>

      <button class="btn no-btn" type="button" onclick="history.back()">いいえ</button>
      <a id="yesBtn" class="btn yes-btn" href="explanation.html">はい</a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const color = params.get("color");

      if (color) {
        document.getElementById("selectedColorBox").style.backgroundColor = color;
        document.getElementById("yesBtn").href = "explanation.html?color=" + encodeURIComponent(color);
      }
    </script>
  </body>
</html>

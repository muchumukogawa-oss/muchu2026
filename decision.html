<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="icon" href="./img/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./img/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./img/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>このいろできまり？</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .title {
        position: absolute;
        left: calc(50% + 15px);
        top: 24px;
        transform: translateX(-50%);
        width: 500px;
        color: #3e0000;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 500;
      }

      .title .red {
        color: #c75637;
        font-weight: 700;
      }

      .title .brown {
        color: #3e0000;
        font-weight: 500;
      }

      .color-box {
        position: absolute;
        left: 329px;
        top: 94px;
        width: 213px;
        height: 195px;
        background: #d9d9d9;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      /* 表情画像の基本配置設定（四角枠の中心基準） */
      .expression {
        position: absolute;
        left: 329px;
        top: 94px;
        width: 213px;
        height: 195px;
        padding: 14px;
        object-fit: contain;
        pointer-events: none;
        transition: transform 0.1s ease;
      }

      /* --- 前の画面と同じ微調整ルール --- */

      /* ショック：右に少し移動 */
      .expression[data-emotion="ショック"] {
        transform: translate(10px, 0);
      }

      /* 不安・心配：右、上に移動 */
      .expression[data-emotion="不安・心配"] {
        transform: translate(20px, -15px);
      }

      /* 悲しい：サイズを大きくし、少し下に移動 */
      .expression[data-emotion="悲しい"] {
        padding: 0;
        transform: translate(0, 10px);
      }

      /* 疲れた：少し上、少し右に移動 */
      .expression[data-emotion="疲れた"] {
        transform: translate(4px, -15px);
      }

      /* 悔しい（color7相当）：少し大きく表示 */
      .expression[data-emotion="悔しい"] {
        padding: 0;
      }

      .expression--white-outline {
        filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff)
          drop-shadow(0 -1px 0 #fff);
      }

      .btn {
        position: absolute;
        width: 180px;
        height: 50px;
        border: 4px solid #624529;
        background: #ffebd3;
        box-shadow: inset 0 0 0 4px #f5b134;
        border-radius: 999px;
        color: #3e0000;
        font-size: 24px;
        font-family: inherit;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .btn:active {
        transform: translateY(2px);
        filter: brightness(0.98);
      }

      .no-btn {
        left: 220px;
        top: 316px;
      }

      .yes-btn {
        left: 489px;
        top: 316px;
      }


    </style>
    <link rel="stylesheet" href="mobile-layout.css" />
    <script src="page-initializers.js" defer></script>
    <script src="page-navigation.js" defer></script>
  </head>

  <body>
    <div class="page">
      <h1 class="title">この<span class="red">いろ</span>できまり？</h1>

      <div id="selectedColorBox" class="color-box" aria-label="選択した色"></div>
      <img id="selectedExpression" class="expression" alt="選んだ色に合う表情" hidden />

      <button class="btn no-btn" type="button" onclick="history.back()">いいえ</button>
      <a id="yesBtn" class="btn yes-btn" href="explanation.html">はい</a>
    </div>


  </body>
</html>

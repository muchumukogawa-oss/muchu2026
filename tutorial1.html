<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きもちってなあに？ - きもちのたんけん</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
      }

      .stage {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
        background: url("img/background_grass.png") center / 100% 100% no-repeat;
      }

      .compass {
        position: absolute;
        z-index: 8;
        top: -10;
        right: 0;
        width: clamp(1000px, 1000vw, 1000px);
        height: auto;
        pointer-events: none;
      }

      .scroll-container {
        position: relative;
        z-index: 2;
        display: flex;
        width: 96%;
        max-width: none;
        height: 96vh;
        max-height: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 4% 6% 5% 18%;
        background: url("img/map.png") center / 100% 100% no-repeat;
      }

      .content-title {
        display: inline-block;
        margin-bottom: 22px;
        padding-bottom: 4px;
        border-bottom: 3px solid #b87b5c;
        color: #4a2828;
        font-size: clamp(22px, 3.6vw, 36px);
        font-weight: 900;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .content-text {
        color: #4a2828;
        font-size: clamp(15px, 2.2vw, 22px);
        font-weight: 900;
        line-height: 1.8;
        text-align: center;
      }

      .content-text p {
        margin-bottom: 16px;
      }

      .highlight-red {
        color: #d93838;
      }

      .highlight-teal {
        color: #2b828a;
      }

      .highlight-blue {
        color: #2b458a;
      }

      .grass-foreground {
        position: absolute;
        z-index: 5;
        inset: 0;
        width: 100%;
        height: 100%;
        background: url("img/grass.png") center / 100% 100% no-repeat;
        pointer-events: none;
      }

      .next-btn {
        position: absolute;
        z-index: 10;
        top: 50%;
        right: 3vw;
        width: 0;
        height: 0;
        transform: translateY(-50%);
        border: solid;
        border-width: 16px 0 16px 26px;
        border-color: transparent transparent transparent #fff;
        filter: drop-shadow(0 0 2px #333) drop-shadow(2px 2px 3px rgb(0 0 0 / 30%));
        text-decoration: none;
        cursor: pointer;
      }

      .next-btn:active {
        transform: translateY(-50%) scale(0.9);
      }

      .dots-container {
        position: absolute;
        z-index: 10;
        bottom: 3.5vh;
        left: 50%;
        display: flex;
        gap: 10px;
        transform: translateX(-50%);
      }

      .dot {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background-color: rgb(255 255 255 / 65%);
      }

      .dot.active {
        background-color: #fff;
        box-shadow: 0 0 4px rgb(0 0 0 / 20%);
      }

      @media (max-width: 600px) {
        .scroll-container {
          width: 96%;
          height: 96vh;
          padding: 5% 5% 8% 16%;
        }

        .content-title {
          margin-bottom: 14px;
        }

        .content-text p {
          margin-bottom: 10px;
        }
      }
    </style>
  </head>

  <body>
    <main class="stage">
      <img src="img/compass.png" alt="コンパス" class="compass" />

      <section class="scroll-container" aria-labelledby="page-title">
        <h1 id="page-title" class="content-title"><span class="highlight-red">きもち</span>ってなあに？</h1>

        <div class="content-text">
          <p>
            <span class="highlight-red">きもちは</span>、よろこんだり、かなしんだりする<br />
            こころのうごきやようすのことだよ。
          </p>
          <p>
            <span class="highlight-teal">きぶん</span>や <span class="highlight-blue">きげん</span>も、
            <span class="highlight-red">きもち</span>とにているよ。<br />
            目には見えないけど、たしかにあるもの。
          </p>
        </div>
      </section>

      <div class="grass-foreground" aria-hidden="true"></div>

      <a href="tutorial2.html" class="next-btn" aria-label="つぎへ"></a>

      <div class="dots-container" aria-label="1ページ目、全6ページ">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>いちばんぴったりないろ - 黄グループ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background-color: #f9f9f9;
      }
      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5vw;
        padding: 0 5vw;
      }
      .back-arrow {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 14px 22px 14px 0;
        border-color: transparent #555 transparent transparent;
        cursor: pointer;
        text-decoration: none;
      }
      .title-area {
        font-size: clamp(16px, 2.4vw, 24px);
        font-weight: 900;
        color: #4a2828;
        line-height: 1.6;
      }
      .highlight-red {
        color: #d93838;
      }
      .highlight-brown {
        color: #b85232;
      }
      .palette-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
        width: clamp(260px, 38vw, 420px);
        height: clamp(260px, 38vw, 420px);
      }
      .color-card {
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: clamp(11px, 1.5vw, 16px);
        font-weight: 900;
        text-decoration: none;
        border-radius: 2px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        transition: transform 0.1s ease;
        padding: 4px;
        text-align: center;
      }
      .color-card:active {
        transform: scale(0.95);
      }
      .split-cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .split-cell .color-card {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="choice1.html" class="back-arrow" aria-label="もどる"></a>
      <div class="title-area">
        <p>「いちばんぴったり」</p>
        <p>な<span class="highlight-red">い</span><span class="highlight-brown">ろ</span>はどれかな？</p>
      </div>
      <div class="palette-grid">
        <!-- (嬉しくて)びっくり -->
        <a
          href="decision.html?color=%23ffcc00"
          class="color-card"
          style="background-color: #ffcc00; color: #333; text-shadow: none"
          >(嬉しくて)<br />びっくり</a
        >
        <!-- おもしろい -->
        <a href="decision.html?color=%23ff9900" class="color-card" style="background-color: #ff9900">おもしろい</a>
        <!-- やる気がある -->
        <a href="decision.html?color=%23ff5050" class="color-card" style="background-color: #ff5050">やる気がある</a>

        <!-- 嬉しい -->
        <a
          href="decision.html?color=%23ffeb3b"
          class="color-card"
          style="background-color: #ffeb3b; color: #333; text-shadow: none"
          >嬉しい</a
        >
        <!-- 興奮した -->
        <a href="decision.html?color=%23ff9e66" class="color-card" style="background-color: #ff9e66">興奮した</a>
        <!-- 飛ぶ -->
        <a
          href="decision.html?color=%23ffff00"
          class="color-card"
          style="background-color: #ffff00; color: #333; text-shadow: none"
          >飛ぶ</a
        >

        <!-- 楽しい -->
        <a href="decision.html?color=%23ffa500" class="color-card" style="background-color: #ffa500">楽しい</a>
        <!-- 幸せ -->
        <a
          href="decision.html?color=%23ffb6c1"
          class="color-card"
          style="background-color: #ffb6c1; color: #333; text-shadow: none"
          >幸せ</a
        >

        <!-- 愛 / 好き（上下分割） -->
        <div class="split-cell">
          <a href="decision.html?color=%23e6005c" class="color-card" style="background-color: #e6005c">愛</a>
          <a
            href="decision.html?color=%23ff99c8"
            class="color-card"
            style="background-color: #ff99c8; color: #333; text-shadow: none"
            >好き</a
          >
        </div>
      </div>
    </div>
  </body>
</html>

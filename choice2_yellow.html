      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .back-arrow {
        position: absolute;
        left: 70.21px;
        top: 17.57px;
        width: 53px;
        height: 47px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        z-index: 100;
        pointer-events: auto;
      }

      .back-arrow svg {
        width: 53px;
        height: 47px;
        display: block;
        pointer-events: none;
      }

      .back-arrow:active {
        transform: translateY(2px) scale(0.96);
        filter: brightness(0.98);
      }

      .content-wrap {
        position: absolute;
        left: 91px;
        top: 0;
        width: 100%;
        height: 100%;
      }

      .title-area {
        position: absolute;
        left: 91px;
        top: 149px;
        width: 300px;
        height: 86px;
        color: #3e0000;
        font-size: 30px;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 0.02em;
        text-align: center;
      }

      .title-area p {
        margin: 0;
      }

      .title-area .highlight-brown {
        color: #c75637;
        font-weight: 700;
      }

      .color-card {
        position: absolute;
        display: block;
        width: 115px;
        height: 115px;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease,
          box-shadow 0.08s ease;
      }

      /* --- 表情画像の配置（中央基準） --- */
      .emotion-img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 70%;
        height: 70%;
        object-fit: contain;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .color-card.short .emotion-img {
        width: 70%;
        height: 70%;
        transform: translate(-50%, -50%);
      }

      .color5 .emotion-img,
      .color6 .emotion-img,
      .color7 .emotion-img,
      .color8 .emotion-img {
        width: 85%;
        height: 85%;
        transform: translate(-50%, -50%);
      }

      /* 嬉しい（.color4）：上方向（-60%）に移動 */
      .color4 .emotion-img {
        width: 85%;
        height: 85%;
        transform: translate(-50%, -60%);
      }

      .color1 .emotion-img {
        width: 65%;
        height: 65%;
        transform: translate(-50%, -50%);
      }

      .color-card:active {
        transform: translateY(2px) scale(0.98);
        filter: brightness(0.97);
        box-shadow: inset 0 6px 10px rgb(0 0 0 / 12%);
      }

      .color-card.short {
        height: 56.5px;
      }

      .color1 {
        left: 426px;
        top: 20px;
        background: #ffcc00;
      }
      .color2 {
        left: 546px;
        top: 20px;
        background: #ff8c00;
      }
      .color3 {
        left: 666px;
        top: 20px;
        background: #ff5a5a;
      }

      .color4 {
        left: 426px;
        top: 139px;
        background: #ffeb3b;
      }
      .color5 {
        left: 546px;
        top: 139px;
        background: #ff9f63;
      }
      .color6 {
        left: 666px;
        top: 139px;
        background: #ffff00;
      }

      .color7 {
        left: 426px;
        top: 258px;
        background: #ffa500;
      }
      .color8 {
        left: 546px;
        top: 258px;
        background: #ffc0cb;
      }

      .color9 {
        left: 666px;
        top: 258px;
        background: #e91e63;
      }
      .color10 {
        left: 666px;
        top: 316.5px;
        background: #f48fb1;
      }

        <a href="./decision.html?color=%23ffcc00" class="color-card color1" aria-label="黄色1：うれしくてびっくり"

        <a href="./decision.html?color=%23ff8c00" class="color-card color2" aria-label="オレンジ1：面白い"

        /></a>
        <a href="./decision.html?color=%23ff5a5a" class="color-card color3" aria-label="赤1：やる気がある"

        /></a>

        <a href="./decision.html?color=%23ffeb3b" class="color-card color4" aria-label="黄色2：嬉しい"

        /></a>
        <a href="./decision.html?color=%23ffc0cb" class="color-card color8" aria-label="ピンク：幸せ"

        <a href="./decision.html?color=%23e91e63" class="color-card color9 short" aria-label="濃いピンク：愛"

        <a href="./decision.html?color=%23f48fb1" class="color-card color10 short" aria-label="薄ピンク：好き"

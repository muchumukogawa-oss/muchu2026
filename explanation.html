<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>このいろは こんなきもち！</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .title {
        position: absolute;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        width: 540px;
        color: #4a2e2e;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 400;
      }

      .title .red {
        color: #d95d5d;
        font-weight: 900;
      }

      .title .orange {
        color: #ca5a2d;
        font-weight: 900;
      }

      .color-box {
        position: absolute;
        left: 192px;
        top: 94px;
        width: 213px;
        height: 195px;
        background: #ff0000;
        overflow: hidden;
        z-index: 1;
      }

      .expression {
        position: absolute;
        left: 192px;
        top: 94px;
        width: 213px;
        height: 195px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        z-index: 2;
      }

      .example-text {
        position: absolute;
        left: 560px;
        top: 152px;
        width: 320px;
        color: #2f2f2f;
        font-size: 28px;
        line-height: 1.5;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      .btn {
        position: absolute;
        width: 180px;
        height: 50px;
        border-radius: 999px;
        border: 4px solid #624529;
        background: #ffebd3;
        box-shadow: inset 0 0 0 4px #f5b134;
        color: #4a2e2e;
        font-size: 24px;
        font-weight: 700;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .btn:active {
        transform: translateY(2px);
        filter: brightness(0.98);
      }

      /* ボタンの位置を統一 */
      .no-btn {
        left: 220px;
        top: 316px;
      }

      .yes-btn {
        left: 489px;
        top: 316px;
      }

      @media (max-width: 900px) {
        .title {
          width: 420px;
          font-size: 30px;
        }

        .example-text {
          left: 442px;
          top: 147px;
          font-size: 24px;
          width: 254px;
        }

        .color-box {
          left: 192px;
          top: 94px;
          width: 213px;
          height: 195px;
        }

        .expression {
          left: 222px;
          top: 107px;
          width: 153px;
          height: 169px;
        }

        /* 小さい画面でもボタン位置を統一 */
        .no-btn {
          left: 220px;
          top: 316px;
        }

        .yes-btn {
          left: 489px;
          top: 316px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <h1 class="title">この<span class="red">いろ</span>は こんな<span class="red">きもち</span>！</h1>

      <div id="selectedColorBox" class="color-box" aria-label="選択した色"></div>

      <img src="img/expression_example.png" class="expression" alt="表情" />

      <div class="example-text">
        とっておいたぷりんを<br />
        たべられた
      </div>

      <a href="choice1.html" class="btn no-btn">はじめから</a>
      <a href="last.html" class="btn yes-btn">つぎへ</a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const selectedColor = params.get("color") || "#ff0000";

      const box = document.getElementById("selectedColorBox");
      box.style.backgroundColor = selectedColor;
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>きもちのつかいかた</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .title {
        position: absolute;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        width: 760px;
        color: #3e0000;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.04em;
        text-align: center;
        font-weight: 500;
      }

      .title .red {
        color: #3e0000;
        font-weight: 700;
      }

      .title .orange {
        color: #3e0000;
        font-weight: 500;
      }

      .color-box {
        position: absolute;
        left: 192px;
        top: 94px;
        width: 213px;
        height: 195px;
        background: #ff0000;
        overflow: hidden;
        z-index: 1;
      }

      .expression {
        position: absolute;
        left: 192px;
        top: 94px;
        width: 213px;
        height: 195px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        z-index: 2;
      }

      .expression--white-outline {
        filter:
          drop-shadow(1px 0 0 #fff)
          drop-shadow(-1px 0 0 #fff)
          drop-shadow(0 1px 0 #fff)
          drop-shadow(0 -1px 0 #fff);
      }

      .example-text {
        position: absolute;
        left: 560px;
        top: 94px;
        width: 320px;
        height: 195px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        color: #3e0000;
        font-size: 24px;
        line-height: 1.45;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-align: left;
        text-wrap: pretty;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .example-text--fixed-lines {
        white-space: pre-line;
      }

      .btn {
        position: absolute;
        width: 180px;
        height: 50px;
        border-radius: 999px;
        border: 4px solid #624529;
        background: #ffebd3;
        box-shadow: inset 0 0 0 4px #f5b134;
        color: #3e0000;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }

      .btn:active {
        transform: translateY(2px);
        filter: brightness(0.98);
      }

      /* ボタンの位置を統一 */
      .no-btn {
        left: 220px;
        top: 316px;
      }

      .yes-btn {
        left: 489px;
        top: 316px;
      }


    </style>
    <link rel="stylesheet" href="mobile-layout.css" />
    <script src="page-initializers.js" defer></script>
    <script src="page-navigation.js" defer></script>
  </head>

  <body>
    <div class="page">
      <h1 class="title"><span id="emotionLabel" class="red">このいろ</span>は こんなときに つかうよ！</h1>

      <div id="selectedColorBox" class="color-box" aria-label="選択した色"></div>

      <img id="expression" src="img/expression_example.png" class="expression" alt="表情" />

      <div id="exampleText" class="example-text"></div>

      <a href="choice1.html" class="btn no-btn">はじめから</a>
      <a href="last.html" class="btn yes-btn">つぎへ</a>
    </div>


  </body>
</html>

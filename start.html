<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>たんけんへ しゅっぱつ！ - きもちのたんけん</title>
    <!-- Google Fontsから全丸ゴシックを読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
      }

      /* 画面全体（背景1：background_grass.png） */
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        background-image: url("img/background_grass.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 右上の大きなコンパス */
      .compass {
        position: absolute;
        top: -25px;
        right: -25px;
        width: clamp(140px, 22vw, 220px);
        height: auto;
        z-index: 8;
        pointer-events: none;
      }

      /* 中央の巻物エリア（map.png） */
      .scroll-container {
        position: relative;
        width: 82%;
        max-width: 860px;
        height: 82vh;
        max-height: 520px;
        z-index: 2; /* 草（z-index: 5）の下に潜り込ませる */

        background-image: url("img/map.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        /* 左の巻物軸部分を考慮した余白 */
        padding: 4% 6% 5% 18%;
      }

      /* 本文テキスト */
      .content-text {
        font-size: clamp(15px, 2.2vw, 22px);
        font-weight: 900;
        color: #4a2828;
        text-align: center;
        line-height: 1.8;
        margin-bottom: 20px;
      }

      .content-text p {
        margin-bottom: 8px;
      }

      /* ルビ（振り仮名）の文字サイズ・装飾 */
      ruby rt {
        font-size: 0.55em;
        font-weight: 700;
        color: #4a2828;
      }

      /* ハイライト文字色 */
      .highlight-red {
        color: #d93838;
      }

      .highlight-brown {
        color: #b85232;
      }

      /* しゅっぱつボタン（button_red.png を使用） */
      .start-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: clamp(160px, 25vw, 240px);
        height: clamp(50px, 8vw, 75px);
        background-image: url("img/button_red.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        color: #ffffff;
        font-size: clamp(18px, 2.8vw, 28px);
        font-weight: 900;
        text-decoration: none;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: transform 0.1s ease;
        margin-top: 5px;
      }

      .start-btn:active {
        transform: scale(0.95);
      }

      /* 前景の草（grass.png：巻物やコンパスの上に重なる） */
      .grass-foreground {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("img/grass.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        pointer-events: none;
        z-index: 5;
      }

      /* 左側の矢印（まえへ：tutorial6へ戻る） */
      .prev-btn {
        position: absolute;
        left: 3vw;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 16px 26px 16px 0;
        border-color: transparent #ffffff transparent transparent;
        filter: drop-shadow(0px 0px 2px #333) drop-shadow(-2px 2px 3px rgba(0, 0, 0, 0.3));
        cursor: pointer;
        z-index: 10;
        text-decoration: none;
        transition: transform 0.1s ease;
      }

      .prev-btn:active {
        transform: translateY(-50%) scale(0.9);
      }

      /* 下部のページ表示（枠線なしの丸） */
      .dots-container {
        position: absolute;
        bottom: 3.5vh;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
      }

      .dot {
        width: 12px;
        height: 12px;
        background-color: rgba(255, 255, 255, 0.65);
        border: none;
        border-radius: 50%;
      }

      .dot.active {
        background-color: #ffffff;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- 右上の大きなコンパス -->
      <img src="img/compass.png" alt="コンパス" class="compass" />

      <!-- 中央の巻物コンテンツ -->
      <div class="scroll-container">
        <div class="content-text">
          <p>
            きみの <span class="highlight-red">きもち</span>は <ruby>何<rt>なに</rt></ruby
            ><span class="highlight-brown">いろ</span>かな？
          </p>
          <p>さがしに いってみよう！</p>
          <p>さあ、たんけんへ しゅっぱつだ！！</p>
        </div>

        <!-- しゅっぱつボタン（choice1） -->
        <a href="choice1.html" class="start-btn">しゅっぱつ</a>
      </div>

      <!-- 前景の草（巻物の手前に被せる） -->
      <div class="grass-foreground"></div>

      <!-- 左矢印（rules2へ戻る） -->
      <a href="rules2.html" class="prev-btn" aria-label="まえへ"></a>

      <!-- 下部のページ丸（6番目がアクティブ） -->
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot active"></div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="mobile-layout.js" defer></script>
    <title>いちばんぴったりないろ - 緑グループ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="mobile-layout.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background: #f3f3f3;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .back-arrow {
        position: absolute;
        /* 変更前: left: 70.21px; top: 17.57px; width: 53px; height: 47px; */
        left: 8.4%; /* 70.21px / 836px */
        top: 4.46%; /* 17.57px / 394px */
        width: 6.34%; /* 53px / 836px */
        height: auto;
        aspect-ratio: 53 / 47;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        z-index: 100;
        pointer-events: auto;
      }

      .back-arrow svg {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      .back-arrow:active {
        transform: translateY(0.5%) scale(0.96);
        filter: brightness(0.98);
      }

      /* 右側のはみ出し防止：left: 0 に変更 */
      .content-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }

      .title-area {
        position: absolute;
        /* 変更前: left: 91px; top: 149px; width: 300px; height: 86px; font-size: 30px; */
        left: 10.89%; /* 91px / 836px */
        top: 37.82%; /* 149px / 394px */
        width: 35.88%; /* 300px / 836px */
        height: 21.83%; /* 86px / 394px */
        color: #3e0000;
        font-size: 3.1vw;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 0.02em;
        text-align: center;
      }

      .title-area p {
        margin: 0;
      }

      .title-area .highlight-brown {
        color: #c75637;
        font-weight: 700;
      }

      .color-card {
        position: absolute;
        display: block;
        /* 変更前: width: 115px; height: 115px; */
        width: 13.76%; /* 115px / 836px */
        height: 29.19%; /* 115px / 394px */
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          filter 0.08s ease,
          box-shadow 0.08s ease;
      }

      .emotion-img {
        position: absolute;
        top: 15%;
        left: 15%;
        width: 70%;
        height: 70%;
        object-fit: contain;
        pointer-events: none;
      }

      .color-card.short .emotion-img {
        top: 50%;
        left: 50%;
        width: 70%;
        height: 70%;
        transform: translate(-50%, -50%);
      }

      .color1 .emotion-img,
      .color4 .emotion-img,
      .color8 .emotion-img {
        top: 7.5%;
        left: 7.5%;
        width: 85%;
        height: 85%;
      }

      .color3 .emotion-img {
        top: 17.5%;
        left: 17.5%;
        width: 65%;
        height: 65%;
      }

      .color6 .emotion-img {
        top: 20%;
        left: 20%;
        width: 60%;
        height: 60%;
      }

      .color-card .emotion-img {
        top: 50%;
        left: 50%;
        width: 60%;
        height: 60%;
        transform: translate(-50%, -50%);
      }

      .color1 .emotion-img,
      .color4 .emotion-img,
      .color8 .emotion-img {
        width: 70%;
        height: 70%;
      }

      .color-card:active {
        transform: translateY(0.5%) scale(0.98);
        filter: brightness(0.97);
        box-shadow: inset 0 0.5vw 0.8vw rgb(0 0 0 / 12%);
      }

      .color-card.short {
        /* 変更前: height: 56.5px; */
        height: 14.34%; /* 56.5px / 394px */
      }

      /* --- 各カードの位置指定 --- */
      /* 1列目 (左): 50.96% */
      .color1 {
        left: 50.96%; /* 426px / 836px */
        top: 5.08%; /* 20px / 394px */
        background: #90ee90;
      }
      .color4 {
        left: 50.96%; /* 426px / 836px */
        top: 35.28%; /* 139px / 394px */
        background: #a5d4ad;
      }
      .color6 {
        left: 50.96%; /* 426px / 836px */
        top: 65.48%; /* 258px / 394px */
        background: #aed581;
      }

      /* 2列目 (中央): 65.31% */
      .color2 {
        left: 65.31%; /* 546px / 836px */
        top: 5.08%; /* 20px / 394px */
        background: #ffd700;
      }
      .color5 {
        left: 65.31%; /* 546px / 836px */
        top: 35.28%; /* 139px / 394px */
        background: #008000;
      }
      .color7 {
        left: 65.31%; /* 546px / 836px */
        top: 65.48%; /* 258px / 394px */
        background: #ffffff;
      }

      /* 3列目 (右): 79.67% */
      .color3 {
        left: 79.67%; /* 666px / 836px */
        top: 5.08%; /* 20px / 394px */
        background: #ffa500;
      }
      .color9 {
        left: 79.67%; /* 666px / 836px */
        top: 35.28%; /* 139px / 394px */
        height: 14.34%; /* 56.5px / 394px */
        background: #ffdab9;
      }
      .color10 {
        left: 79.67%; /* 666px / 836px */
        top: 50.13%; /* 197.5px / 394px */
        height: 14.34%; /* 56.5px / 394px */
        background: #ccff99;
      }
      .color8 {
        left: 79.67%; /* 666px / 836px */
        top: 65.48%; /* 258px / 394px */
        background: #00fa9a;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <a href="./choice1.html" class="back-arrow" aria-label="戻る">
        <svg
          viewBox="0 0 53 47"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M35 4 Q39 4 39 8 L39 39 Q39 43 35 41 L10 26 Q5 23.5 10 20 Z"
            fill="#ffffff"
            stroke="#403a3a"
            stroke-width="3"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
      </a>

      <div class="content-wrap">
        <div class="title-area">
          <p>「いちばんぴったり」</p>
          <p>な<span class="highlight-brown">いろ</span>はどれかな？</p>
        </div>

        <a
          href="./decision.html?color=%2390ee90"
          class="color-card color1"
          aria-label="薄緑：気楽・のんびり"
          ><img src="img/気楽・のんびり.svg" alt="" class="emotion-img"
        /></a>
        <a
          href="./decision.html?color=%23ffd700"
          class="color-card color2"
          aria-label="黄色：素敵"
          ><img src="img/素敵.svg" alt="" class="emotion-img"
        /></a>
        <a
          href="./decision.html?color=%23ffa500&amp;label=%E3%81%8B%E3%82%93%E3%81%A9%E3%81%86"
          class="color-card color3"
          aria-label="オレンジ：感動"
          ><img src="img/嬉しくてびっくり.svg" alt="" class="emotion-img"
        /></a>

        <a
          href="./decision.html?color=%23a5d4ad"
          class="color-card color4"
          aria-label="緑グレー：リラックス"
          ><img src="img/リラックス.svg" alt="" class="emotion-img"
        /></a>
        <a
          href="./decision.html?color=%23008000"
          class="color-card color5"
          aria-label="緑：安心・ほっとする"
          ><img src="img/安心する.svg" alt="" class="emotion-img"
        /></a>

        <a
          href="./decision.html?color=%23aed581"
          class="color-card color6"
          aria-label="黄緑：穏やか"
          ><img src="img/穏やか.svg" alt="" class="emotion-img"
        /></a>
        <a
          href="./decision.html?color=%23ffffff"
          class="color-card color7"
          aria-label="白：気にしない"
          ><img src="img/気にしない.svg" alt="" class="emotion-img"
        /></a>
        <a
          href="./decision.html?color=%2300fa9a"
          class="color-card color8"
          aria-label="ミント：気持ちいい"
          ><img src="img/気持ちいい.svg" alt="" class="emotion-img"
        /></a>

        <a
          href="./decision.html?color=%23ffdab9"
          class="color-card color9 short"
          aria-label="ベージュ：感謝"
          ><img src="img/感謝する.svg" alt="" class="emotion-img"
        /></a>
        <a
          href="./decision.html?color=%23ccff99"
          class="color-card color10 short"
          aria-label="薄黄緑：優しい・親切"
          ><img src="img/優しい.svg" alt="" class="emotion-img"
        /></a>
      </div>
    </div>
  </body>
</html>

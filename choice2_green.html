<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>いちばんぴったりないろ - 緑グループ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Zen Maru Gothic", sans-serif;
        background-color: #f9f9f9;
      }
      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5vw;
        padding: 0 5vw;
      }
      .back-arrow {
        position: absolute;
        top: 5vh;
        left: 5vw;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 14px 22px 14px 0;
        border-color: transparent #555 transparent transparent;
        cursor: pointer;
        text-decoration: none;
      }
      .title-area {
        font-size: clamp(16px, 2.4vw, 24px);
        font-weight: 900;
        color: #4a2828;
        line-height: 1.6;
      }
      .highlight-red {
        color: #d93838;
      }
      .highlight-brown {
        color: #b85232;
      }
      .palette-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
        width: clamp(260px, 38vw, 420px);
        height: clamp(260px, 38vw, 420px);
      }
      .color-card {
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: clamp(11px, 1.5vw, 16px);
        font-weight: 900;
        text-decoration: none;
        border-radius: 2px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        transition: transform 0.1s ease;
        padding: 4px;
        text-align: center;
      }
      .color-card:active {
        transform: scale(0.95);
      }
      .split-cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .split-cell .color-card {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="choice1.html" class="back-arrow" aria-label="もどる"></a>
      <div class="title-area">
        <p>「いちばんぴったり」</p>
        <p>な<span class="highlight-red">い</span><span class="highlight-brown">ろ</span>はどれかな？</p>
      </div>
      <div class="palette-grid">
        <!-- 気楽・のんびり -->
        <a
          href="decision.html?color=%238ce68c"
          class="color-card"
          style="background-color: #8ce68c; color: #333; text-shadow: none"
          >気楽・<br />のんびり</a
        >
        <!-- 勇敢 -->
        <a
          href="decision.html?color=%23ffd700"
          class="color-card"
          style="background-color: #ffd700; color: #333; text-shadow: none"
          >勇敢</a
        >
        <!-- 感動 -->
        <a href="decision.html?color=%23ff9900" class="color-card" style="background-color: #ff9900">感動</a>

        <!-- リラックス -->
        <a
          href="decision.html?color=%23a3c9a8"
          class="color-card"
          style="background-color: #a3c9a8; color: #111; text-shadow: none"
          >リラックス</a
        >
        <!-- 安心する・ほっとする -->
        <a href="decision.html?color=%23008000" class="color-card" style="background-color: #008000"
          >安心する・<br />ほっとする</a
        >

        <!-- 感謝 / 優しい・親切（上下分割） -->
        <div class="split-cell">
          <a
            href="decision.html?color=%23ffe4c4"
            class="color-card"
            style="background-color: #ffe4c4; color: #333; text-shadow: none"
            >感謝</a
          >
          <a
            href="decision.html?color=%23ccff99"
            class="color-card"
            style="background-color: #ccff99; color: #333; text-shadow: none"
            >優しい・親切</a
          >
        </div>

        <!-- 穏やか -->
        <a
          href="decision.html?color=%23abdb8a"
          class="color-card"
          style="background-color: #abdb8a; color: #333; text-shadow: none"
          >穏やか</a
        >
        <!-- 気にしない -->
        <a
          href="decision.html?color=%23ffffff"
          class="color-card"
          style="background-color: #ffffff; color: #333; border: 1px solid #ccc; text-shadow: none"
          >気にしない</a
        >
        <!-- 気持ちいい -->
        <a href="decision.html?color=%2300e699" class="color-card" style="background-color: #00e699">気持ちいい</a>
      </div>
    </div>
  </body>
</html>
